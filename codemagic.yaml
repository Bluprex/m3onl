workflows:
  metin3-ios-test:
    name: Metin3 iOS Test
    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      xcode: latest

    scripts:
      - name: Git LFS dosyalarını çek
        script: |
          git lfs install
          git lfs pull

      - name: Xcode proje kontrolü
        script: |
          ls -la
          xcodebuild -list -project Unity-iPhone.xcodeproj

      - name: Metin3 iOS unsigned build
        script: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
